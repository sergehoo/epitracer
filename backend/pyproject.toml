[tool.black]
line-length = 100
target-version = ["py311"]
exclude = '''
/(
    \.git
  | \.venv
  | migrations
  | build
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S", "C90", "N"]
ignore = ["S101", "DJ001", "B008"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "DJ"]
"**/migrations/**" = ["E", "F", "I", "B", "UP", "DJ", "N"]
"**/settings/*" = ["S105", "S106", "F403", "F405"]

# ---------------------------------------------------------------------------
# Base de référence Ruff (dette existante au 2026-10-24, commit c17e685).
# Findings préexistants non auto-corrigeables, gelés par fichier pour que la
# CI passe sans refonte : les fichiers absents de cette liste sont contrôlés
# intégralement, et toute règle non listée reste active partout.
# Règle : cette liste ne fait que diminuer. Après avoir corrigé un fichier,
# retirer son entrée (ou le code corrigé) puis lancer `ruff check apps config`.
# Ne jamais y ajouter de fichier ni de règle.
# ---------------------------------------------------------------------------
[tool.ruff.lint.extend-per-file-ignores]
"apps/accounts/serializers.py" = ["E501", "S112"]
"apps/accounts/views.py" = ["N806", "S110"]
"apps/analytics/views.py" = ["C901", "F841", "S110"]
